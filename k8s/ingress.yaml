apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: luxe-hotel-agic-ingress
  namespace: hotel-production
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    appgw.ingress.kubernetes.io/request-timeout: "30"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "60"
spec:
  tls:
    - hosts:
        - "luxury-hotel.bhawesh.dev"
      secretName: luxe-hotel-tls-secret
  rules:
    - host: "luxury-hotel.bhawesh.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: luxe-hotel-frontend-service
                port:
                  number: 80
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: luxe-hotel-booking-service
                port:
                  number: 8080
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: luxe-hotel-ingestion-service
                port:
                  number: 8090
