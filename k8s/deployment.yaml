apiVersion: apps/v1
kind: Deployment
metadata:
  name: luxe-hotel-booking-engine
  namespace: hotel-production
  labels:
    app.kubernetes.io/name: luxe-hotel-booking-engine
    app.kubernetes.io/part-of: 5star-hospitality-platform
    app.kubernetes.io/tier: backend
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: luxe-hotel-booking-engine
  template:
    metadata:
      labels:
        app: luxe-hotel-booking-engine
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - luxe-hotel-booking-engine
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: booking-engine
          image: ghcr.io/bhawesh-devops/luxe-hotel-booking-engine:v2.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "hotel-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: KAFKA_TOPIC_RESERVATIONS
              value: "hotel.reservations.events.v1"
            - name: ENVIRONMENT
              value: "production"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
