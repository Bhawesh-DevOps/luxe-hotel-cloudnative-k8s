apiVersion: apps/v1
kind: Deployment
metadata:
  name: luxe-hotel-ingestion-worker
  namespace: hotel-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: luxe-hotel-ingestion
  template:
    metadata:
      labels:
        app: luxe-hotel-ingestion
    spec:
      containers:
        - name: ingestion-worker
          image: ghcr.io/bhawesh-devops/luxe-hotel-ingestion:v1.0.0
          env:
            - name: KAFKA_BROKER
              value: "hotel-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: TOPIC
              value: "hotel.reservations.events.v1"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: luxe-hotel-ingestion-service
  namespace: hotel-production
spec:
  type: ClusterIP
  selector:
    app: luxe-hotel-ingestion
  ports:
    - port: 8090
      targetPort: 8090
