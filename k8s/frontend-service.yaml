apiVersion: apps/v1
kind: Deployment
metadata:
  name: luxe-hotel-frontend-ui
  namespace: hotel-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: luxe-hotel-frontend
  template:
    metadata:
      labels:
        app: luxe-hotel-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: luxe-hotel-frontend-service
  namespace: hotel-production
spec:
  type: ClusterIP
  selector:
    app: luxe-hotel-frontend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
